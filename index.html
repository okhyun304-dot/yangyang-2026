const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:D.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.v)},key,b(D.c)));
  document.open();document.write(html);document.close();
}
const K='yy_pw';
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value,m=document.getElementById('msg'),keep=document.getElementById('keep').checked;
  m.style.color='';m.textContent='여는 중…';
  try{await open_(pw);try{if(keep)localStorage.setItem(K,pw)}catch(_){}}
  catch(_){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않습니다';}
};
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(_){}if(s){try{await open_(s)}catch(_){try{localStorage.removeItem(K)}catch(__){}}}})();
</script></body></html>
